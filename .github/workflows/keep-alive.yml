name: Keep AINOS Server Alive

on:
  schedule:
    # Run every 5 minutes to prevent Render free tier from sleeping
    - cron: '*/5 * * * *'
    # Run daily at 9 AM UTC to auto-publish one blog per connected website
    - cron: '0 9 * * *'
    # Run daily at 3 AM UTC: refresh monthly credits + expire subscriptions/tool-subs
    # (Phase 6 reliable cron — no paid Render instance required)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping AINOS health endpoint
        run: |
          echo "Pinging AINOS server to prevent cold start..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://ainos-ywu0.onrender.com/api/ping)
          echo "Response status: $response"
          if [ "$response" = "200" ]; then
            echo "✅ AINOS server is alive"
          else
            echo "⚠️ AINOS server returned $response"
          fi

      - name: Ping GST Scraper service
        run: |
          echo "Pinging GST Scraper health endpoint to prevent cold start (no GSTN call)..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://ainos-gst-scraper.onrender.com/api/v1/health)
          echo "Response status: $response"
          if [ "$response" = "200" ]; then
            echo "✅ GST Scraper is alive"
          else
            echo "⚠️ GST Scraper returned $response"
          fi
      
      - name: Ping Template Extractor service
        run: |
          echo "Pinging Template Extractor to prevent cold start..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://ainos-template-extractor.onrender.com/api/v1/health)
          echo "Response status: $response"
          if [ "$response" = "200" ]; then
            echo "✅ Template Extractor is alive"
          else
            echo "⚠️ Template Extractor returned $response"
          fi

  auto-publish-blogs:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 9 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger daily blog auto-publishing
        run: |
          echo "Triggering daily blog auto-publishing..."
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET || 'ainos-cron-2024' }}" \
            https://ainos-ywu0.onrender.com/api/blog-agent/auto-generate)
          echo "Auto-publish status: $response"
          if [ "$response" = "200" ]; then
            echo "✅ Blog auto-publishing triggered"
          else
            echo "⚠️ Auto-publishing returned $response"
          fi

  billing-cron:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Run daily billing / credits / tool-subscription expiry cron
        run: |
          echo "Triggering /api/cron/refresh-credits (credit refill + subscription/tool-sub expiry)..."
          response=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${{ secrets.CRON_SECRET || 'ainos-cron-2024' }}" https://ainos-ywu0.onrender.com/api/cron/refresh-credits)
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Cron status: $code"
          echo "Result: $body"
          if [ "$code" = "200" ]; then
            echo "✅ Billing cron completed"
          else
            echo "⚠️ Billing cron returned $code"
          fi
